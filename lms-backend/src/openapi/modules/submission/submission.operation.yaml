post:
  summary: The Submission of the course
  parameters: 
    - $ref: '../../parameters/path.parameters.yaml'

  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - assignmentId
            - answers
            - hashValidation
          properties:
            assignmentId:
              type: string
              format: uuid
              description: The Id of assignment being submitted eg
            hashValidation:
              type: string
              format: base64
              description: If double request comes and body mismatch then throw Error
              nullable: false
            answers:
              type: array
              description: It is the Array of the answers 
              uniqueItems: true
              minItems: 1
              items:
                type: object
                required:
                  - questionId
                  - answerText
                properties:
                  questionId:
                    type: string
                    format: uuid
                    nullable: false 
                    description: The Id of particular Question eg:(id:3b241101-e2bb-4255-8caf-4136c566a962).
                  answerText:
                    type: string
                    nullable: false 
                    minLength: 1

  responses:
    '202':
      description: Assignment Submitted Successfully
      content: 
        application/json:
          schema:
            $ref: '../../event/submission.created.event.yaml'

    '404':
      description: Course not found
      content:
        application/json:
          schema:
            $ref: '../../shared/error.yaml'
    '401':
      description: Unauthorised Access
      content:
        application/json:
          schema:
            $ref: '../../shared/error.yaml'
    '409':
      description: Conflict Error
      content:
        application/json:
          schema:
            $ref: '../../shared/error.yaml'

