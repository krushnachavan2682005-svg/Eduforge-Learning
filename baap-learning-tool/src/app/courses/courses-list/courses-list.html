<div
  class="mx-2 sm:mx-3 md:mx-6 lg:mx-8 theme-text-secondary theme-text-dark flex flex-col min-h-[calc(100vh-110px)] pb-20 sm:pb-16"
>
  <div class="flex-1">
    <div class="theme-text theme-text-dark">
      <div class="header bg-white">
        @for (head of headers; track head) {
          <div class="header bg-white pt-2">
            <app-header [name]="head?.title" [studentClass]="head?.subtitle">
              <div class="mt-2 flex">
                <app-add-courses
                  [open]="showAddCourseModal"
                  (close)="closeAddCourseModal()"
                  (courseAdded)="onCourseAdded()"
                >
                </app-add-courses>
                <div class="mx-3">
                  <app-assgin-course
                    [show]="openAssignMenubar"
                    (closePopUp)="closeAddCourseModal()"
                  >
                  </app-assgin-course>
                </div>
              </div>
            </app-header>
          </div>
        }
      </div>

      <div class="mt-3 relative">
        @if (isLoading) {
          <div class="p-4">
            <ngx-skeleton-loader
              count="10"
              appearance="line"
              [theme]="skeletonService.lineTheme"
            >
            </ngx-skeleton-loader>
          </div>
        }
        @if (!isLoading) {
          <div class="overflow-y-auto max-h-[calc(100vh-150px)] pr-1">
            @for (course of coursesList(); track $index) {
              <div class="mb-4">
                <div
                  class="flex rounded justify-between items-center cursor-pointer p-2 theme-bg-secondary theme-text theme-text-dark theme-bg-gray"
                  (click)="goToViewCourse(course)"
                >
                  <div class="flex items-center gap-3 flex-1">
                    <span class="font-bold text-lg">{{ course?.title }}</span>
                  </div>

                  <div
                    class="flex items-center gap-2 ml-4"
                    (click)="$event.stopPropagation()"
                  >
                    <button
                      (click)="editCourse(course, $event)"
                      class="p-2 relative text-white rounded-lg theme-text-dark theme-text"
                    >
                      <svg
                        appTooltip="Edit"
                        tooltipPosition="left"
                        class="w-5 h-5"
                        fill="none"
                        stroke="currentColor"
                        viewBox="0 0 24 24"
                      >
                        <path
                          stroke-linecap="round"
                          stroke-linejoin="round"
                          stroke-width="2"
                          d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"
                        ></path>
                      </svg>
                    </button>

                    <button
                      (click)="deleteCourse(course)"
                      class="p-2 relative text-white rounded-lg theme-text-dark theme-text"
                    >
                      <svg
                        appTooltip="Delete"
                        tooltipPosition="left"
                        class="w-5 h-5 text-red-600"
                        fill="none"
                        stroke="currentColor"
                        viewBox="0 0 24 24"
                      >
                        <path
                          stroke-linecap="round"
                          stroke-linejoin="round"
                          stroke-width="2"
                          d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"
                        ></path>
                      </svg>
                    </button>
                  </div>
                </div>
              </div>
            }
          </div>
        }
      </div>
    </div>
  </div>

  <app-pagination
    [currentPage]="currentPage"
    [totalPages]="totalPages"
    [pageSize]="pageSize"
    [pageSizeOptions]="pageSizeOptions"
    (pageChange)="goToPage($event)"
    (pageSizeChange)="onPageSizeChange($event)"
  ></app-pagination>
</div>
