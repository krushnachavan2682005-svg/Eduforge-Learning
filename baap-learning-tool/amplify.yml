version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 20.19.0
        - nvm use 20.19.0
        - npm config set legacy-peer-deps true 
        - npm ci
    build:
      commands:
        - if [ "${AWS_BRANCH}" = "development" ]; then export BFLAG=build; fi
        - if [ "${AWS_BRANCH}" = "demo" ]; then export BFLAG=build-demo; fi
        - npm run ${BFLAG}
  artifacts:
    baseDirectory: dist/credit_portal/browser
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*